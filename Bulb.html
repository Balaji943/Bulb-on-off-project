<!DOCTYPE html>
<html>
<body>

<h2>What Can JavaScript Do?</h2>

<p>JavaScript can change HTML attribute values.</p>

<p>In this case JavaScript changes the value of the src (source) attribute of an image.</p>

<button onclick="document.getElementById('myImage').src='https://cdn.pixabay.com/photo/2016/12/01/13/10/lightbulb-1875247_1280.jpg'">Turn on the light</button>

<img id="myImage" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQEm_OCnWDYaOQ6oGMOZjZFbq_REM8Pv6MLwg&s" style="width:100px">

<button onclick="document.getElementById('myImage').src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQEm_OCnWDYaOQ6oGMOZjZFbq_REM8Pv6MLwg&s'">Turn off the light</button>

</body>
</html>
